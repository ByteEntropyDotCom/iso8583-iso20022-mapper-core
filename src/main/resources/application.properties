# =========================================================
# Application Identity
# =========================================================
spring.application.name=iso8583-iso20022-mapper-core
server.port=8080

# =========================================================
# The Java 21 "Superpower": Virtual Threads
# =========================================================
# Ensures high-concurrency without blocking OS threads
spring.threads.virtual.enabled=true

# =========================================================
# Web Layer & Content Negotiation (THE CRITICAL FIX)
# =========================================================
# Forces Spring to ignore "Accept" headers and use JSON by default for REST
spring.mvc.contentnegotiation.default-content-type=application/json
spring.mvc.contentnegotiation.favor-parameter=false

# Prevents Spring from auto-detecting XML and hijacking the JSON converters
spring.main.allow-bean-definition-overriding=true
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jackson.Jackson2ObjectMapperBuilderCustomizerConfiguration$XmlJackson2ObjectMapperBuilderCustomizerConfiguration

# =========================================================
# Jackson Formatting
# =========================================================
# Ensures the XML output from our manual mappers is pretty-printed
spring.jackson.serialization.indent_output=true
spring.jackson.time-zone=UTC

# =========================================================
# Logging & Traceability
# =========================================================
# Shows the Virtual Thread name (e.g., [vthread-1]) in the logs
logging.level.com.byteentropy=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n